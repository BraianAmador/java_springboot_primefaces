<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="http://primefaces.org/ui">

    <!-- Diálogo para crear o editar usuarios -->
    <p:dialog
            id="dialogoUsuario"
            widgetVar="dialogoUsuario"
            header="#{usuarioView.tituloDialogo}"
            modal="true"
            closable="true"
            resizable="false"
            width="500">

        <p:outputPanel id="dialogoUsuarioContenido">

            <h:panelGrid
                    columns="2"
                    cellpadding="8"
                    styleClass="usuarios__formulario">

                <p:outputLabel for="numero" value="Número:" />
                <p:inputText
                        id="numero"
                        value="#{usuarioView.nuevoUsuario.numero}"
                        required="true"
                        requiredMessage="El número es obligatorio." />

                <p:outputLabel for="interno" value="Interno:" />
                <p:inputText
                        id="interno"
                        value="#{usuarioView.nuevoUsuario.interno}"
                        required="true"
                        requiredMessage="El interno es obligatorio." />

                <p:outputLabel for="nombre" value="Nombre:" />
                <p:inputText
                        id="nombre"
                        value="#{usuarioView.nuevoUsuario.nombre}"
                        required="true"
                        requiredMessage="El nombre es obligatorio." />

                <p:outputLabel for="apellido" value="Apellido:" />
                <p:inputText
                        id="apellido"
                        value="#{usuarioView.nuevoUsuario.apellido}"
                        required="true"
                        requiredMessage="El apellido es obligatorio." />

                <p:outputLabel for="empresa" value="Empresa:" />
                <p:selectOneMenu
                        id="empresa"
                        value="#{usuarioView.empresaSeleccionadaId}"
                        style="width: 100%;">

                    <f:selectItem
                            itemLabel="Seleccionar empresa"
                            itemValue="#{null}"
                            noSelectionOption="true" />

                    <f:selectItems
                            value="#{usuarioView.empresas}"
                            var="empresa"
                            itemLabel="#{empresa.nombre}"
                            itemValue="#{empresa.id}" />

                </p:selectOneMenu>

                <p:outputLabel for="sector" value="Sector:" />
                <p:selectOneMenu
                        id="sector"
                        value="#{usuarioView.sectorSeleccionadoId}"
                        style="width: 100%;">

                    <f:selectItem
                            itemLabel="Seleccionar sector"
                            itemValue="#{null}"
                            noSelectionOption="true" />

                    <f:selectItems
                            value="#{usuarioView.sectores}"
                            var="sector"
                            itemLabel="#{sector.nombre}"
                            itemValue="#{sector.id}" />

                </p:selectOneMenu>

                <p:outputLabel for="ubicacion" value="Ubicación:" />
                <p:selectOneMenu
                        id="ubicacion"
                        value="#{usuarioView.ubicacionSeleccionadaId}"
                        style="width: 100%;">

                    <f:selectItem
                            itemLabel="Seleccionar ubicación"
                            itemValue="#{null}"
                            noSelectionOption="true" />

                    <f:selectItems
                            value="#{usuarioView.ubicaciones}"
                            var="ubicacion"
                            itemLabel="#{ubicacion.direccion}"
                            itemValue="#{ubicacion.id}" />

                </p:selectOneMenu>

            </h:panelGrid>

            <p:separator />

            <!-- Botones -->
            <div style="display: flex; justify-content: flex-end; gap: 12px;">

                <p:commandButton
                        value="Cancelar"
                        icon="pi pi-times"
                        styleClass="ui-button-secondary"
                        process="@this"
                        action="#{usuarioView.cancelar}"
                        oncomplete="PF('dialogoUsuario').hide();" />

                <p:commandButton
                        value="Guardar"
                        icon="pi pi-save"
                        styleClass="ui-button-success"
                        action="#{usuarioView.guardar}"
                        process=":formUsuarios:dialogoUsuarioContenido"
                        update=":formUsuarios:tablaUsuarios :formUsuarios:mensajes :formUsuarios:dialogoUsuarioContenido"
                        oncomplete="if (!args.validationFailed) PF('dialogoUsuario').hide();" />

            </div>

        </p:outputPanel>

    </p:dialog>

</ui:composition>
